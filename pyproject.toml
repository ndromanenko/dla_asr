[project]
name = "pytorch-project-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "comet-ml>=3.58.8",
    "datasets>=5.1.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pandas<3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch==2.8.0",
    "torch-audiomentations>=0.12.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
